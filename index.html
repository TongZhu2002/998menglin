<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可爱猪头动画</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fffaf0; /* 温暖的背景色 */
        }
        canvas {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .text {
            font-family: "Arial", sans-serif;
            font-size: 20px;
            color: #8B4513; /* 深棕色 */
            font-weight: bold;
            position: absolute;
            top: 65%; /* 文字位置 */
            transition: opacity 1s ease-in-out;
        }
    </style>
</head>
<body>
    <canvas id="pigCanvas" width="300" height="350"></canvas>
    <div id="text" class="text">雪雪包天天开心</div>

    <script>
        const canvas = document.getElementById("pigCanvas");
        const ctx = canvas.getContext("2d");

        // 颜色 & 线条设置
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#5a4033"; // 深棕色线条
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        let earWiggle = 0; // 耳朵摆动动画
        let noseScale = 1; // 鼻子呼吸效果
        let eyeBlink = 1;  // 眼睛睁开状态（1=睁开，0=闭眼）
        let floatOffset = 0; // 上下浮动动画
        let floatDirection = 1; // 控制浮动方向
        let frame = 0; // 记录动画帧数

        function drawPig() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // **计算整体漂浮动画（呼吸感）**
            floatOffset = Math.sin(frame * 0.05) * 5; // 缓慢上下浮动

            ctx.save();
            ctx.translate(0, floatOffset); // 让整个猪头上下浮动

            // **绘制头部**
            ctx.beginPath();
            ctx.arc(150, 150, 80, 0, Math.PI * 2);
            ctx.fillStyle = "#FFC0CB"; // 粉色
            ctx.fill();
            ctx.stroke();

            // **绘制耳朵（带晃动效果）**
            let earOffset = Math.sin(earWiggle) * 3; // 轻微摆动
            ctx.beginPath();
            ctx.moveTo(85, 90 + earOffset);
            ctx.quadraticCurveTo(50, 40, 90, 75 + earOffset);
            ctx.quadraticCurveTo(110, 60, 95, 95);
            ctx.fillStyle = "#FFC0CB";
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(215, 90 - earOffset);
            ctx.quadraticCurveTo(250, 40, 210, 75 - earOffset);
            ctx.quadraticCurveTo(190, 60, 205, 95);
            ctx.fill();
            ctx.stroke();

            // **绘制鼻子（带呼吸效果）**
            ctx.beginPath();
            let noseBreath = 1 + 0.05 * Math.sin(frame * 0.1); // 呼吸缩放
            ctx.ellipse(150, 170, 35 * noseBreath, 25 * noseBreath, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#FF8C94"; // 深粉色
            ctx.fill();
            ctx.stroke();

            // 鼻孔
            ctx.fillStyle = "#5a4033"; // 深棕色
            ctx.beginPath();
            ctx.arc(140, 170, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(160, 170, 5, 0, Math.PI * 2);
            ctx.fill();

            // **绘制眼睛（带眨眼效果）**
            ctx.fillStyle = "#000";
            ctx.beginPath();
            if (eyeBlink > 0.2) {
                ctx.arc(130, 130, 8, 0, Math.PI * 2); // 眼睛睁开
                ctx.arc(170, 130, 8, 0, Math.PI * 2);
            } else {
                ctx.fillRect(122, 127, 16, 4); // 眨眼
                ctx.fillRect(162, 127, 16, 4);
            }
            ctx.fill();

            ctx.restore(); // 结束漂浮动画

            // **动画逻辑**
            earWiggle += 0.1;  // 耳朵轻微晃动
            eyeBlink = Math.abs(Math.sin(frame * 0.05)); // 眨眼
            frame++; // 更新帧数

            requestAnimationFrame(drawPig);
        }

        // **启动动画**
        drawPig();
    </script>
</body>
</html>
