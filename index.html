<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可爱猪头动画</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fffaf0; /* 温暖的背景色 */
        }
        canvas {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <canvas id="pigCanvas" width="300" height="300"></canvas>

    <script>
        const canvas = document.getElementById("pigCanvas");
        const ctx = canvas.getContext("2d");

        // 手绘风格参数
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#5a4033"; // 深棕色线条，柔和一点
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        let progress = 0;  // 记录动画进度

        function drawPig() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制头部（圆形）
            if (progress >= 0.1) {
                ctx.beginPath();
                ctx.arc(150, 150, 80, 0, Math.PI * 2);
                ctx.fillStyle = "#FFC0CB"; // 粉色
                ctx.fill();
                ctx.stroke();
            }

            // 绘制耳朵
            if (progress >= 0.2) {
                ctx.beginPath();
                ctx.moveTo(90, 90);
                ctx.quadraticCurveTo(60, 50, 100, 80); // 左耳
                ctx.fillStyle = "#FFC0CB";
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(210, 90);
                ctx.quadraticCurveTo(240, 50, 200, 80); // 右耳
                ctx.fill();
                ctx.stroke();
            }

            // 绘制鼻子
            if (progress >= 0.4) {
                ctx.beginPath();
                ctx.ellipse(150, 170, 35, 25, 0, 0, Math.PI * 2);
                ctx.fillStyle = "#FF8C94"; // 深粉色
                ctx.fill();
                ctx.stroke();
            }

            // 鼻孔
            if (progress >= 0.5) {
                ctx.fillStyle = "#5a4033"; // 深棕色
                ctx.beginPath();
                ctx.arc(140, 170, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(160, 170, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // 眼睛
            if (progress >= 0.6) {
                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.arc(130, 130, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(170, 130, 8, 0, Math.PI * 2);
                ctx.fill();
            }

            // 嘴巴
            if (progress >= 0.8) {
                ctx.beginPath();
                ctx.moveTo(135, 190);
                ctx.quadraticCurveTo(150, 210, 165, 190); // 微笑弧线
                ctx.stroke();
            }

            // 递增动画进度
            progress += 0.02;
            if (progress <= 1) {
                requestAnimationFrame(drawPig);
            }
        }

        drawPig();
    </script>
</body>
</html>
