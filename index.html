<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可爱猪头</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe4e1;
        }
    </style>
</head>
<body>
    <svg width="300" height="300">
        <!-- 猪头 -->
        <ellipse cx="150" cy="150" rx="80" ry="70" fill="pink" stroke="black" stroke-width="3"/>
        
        <!-- 耳朵 (左) -->
        <polygon points="90,100 60,60 100,80" fill="pink" stroke="black" stroke-width="3"/>
        
        <!-- 耳朵 (右) -->
        <polygon points="210,100 240,60 200,80" fill="pink" stroke="black" stroke-width="3"/>
        
        <!-- 鼻子 -->
        <ellipse cx="150" cy="170" rx="40" ry="25" fill="hotpink" stroke="black" stroke-width="3"/>
        
        <!-- 鼻孔 -->
        <circle cx="140" cy="170" r="5" fill="black"/>
        <circle cx="160" cy="170" r="5" fill="black"/>
        
        <!-- 眼睛 -->
        <circle cx="130" cy="130" r="10" fill="black"/>
        <circle cx="170" cy="130" r="10" fill="black"/>
        
        <!-- 嘴巴 -->
        <path d="M130,190 Q150,210 170,190" stroke="black" stroke-width="3" fill="none"/>
    </svg>
</body>
</html>
