<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Animated Pig Drawing</title>
<style>
  body {
    background-color: #fdf5e6; /* 温暖的浅色背景 */
    margin: 0;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background-color: #fdf5e6;
  }
</style>
</head>
<body>
<canvas id="pigCanvas" width="400" height="400"></canvas>
<script>
  // 兼容处理：确保 requestAnimationFrame 可用
  window.requestAnimationFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame
                                 || window.mozRequestAnimationFrame || window.msRequestAnimationFrame
                                 || function(cb){ return setTimeout(cb, 16); };
  const canvas = document.getElementById('pigCanvas');
  const ctx = canvas.getContext('2d');
  // 绘制样式设置
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#000";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  // 各部位的坐标和尺寸参数
  const centerX = 200, centerY = 220;
  const headRadius = 80;
  const leftEar = { base1:{x:130,y:170}, tip:{x:150,y:110}, base2:{x:180,y:150} };
  const rightEar = { base1:{x:270,y:170}, tip:{x:250,y:110}, base2:{x:220,y:150} };
  const eyeRadius = 5;
  const leftEye = {x:170, y:200};
  const rightEye= {x:230, y:200};
  const snoutCenter={x:200,y:240};
  const snoutRadiusX=30, snoutRadiusY=20;
  const nostrilRadius=5;
  const nostrilOffsetX=12, nostrilOffsetY=-5;
  const leftNostril={x: snoutCenter.x - nostrilOffsetX, y: snoutCenter.y + nostrilOffsetY};
  const rightNostril={x: snoutCenter.x + nostrilOffsetX, y: snoutCenter.y + nostrilOffsetY};
  const mouthLeft={x:185,y:265}, mouthRight={x:215,y:265}, mouthCtrl={x:200,y:275};
  // 动画状态控制
  let phase = 0;
  let step = 0;
  // 各绘制阶段所需步数和延迟帧数
  const headSteps=100;
  const leftEarEdge1Steps=20, leftEarEdge2Steps=20;
  const rightEarEdge1Steps=20, rightEarEdge2Steps=20;
  const snoutSteps=60;
  const headFillDelay=15, earFillDelay=10, snoutFillDelay=15;
  function animate() {
    switch(phase) {
      case 0: // 绘制头部轮廓（圆形）逐渐
        if(step < headSteps) {
          const angle1 = (step / headSteps) * 2 * Math.PI;
          const angle2 = ((step + 1) / headSteps) * 2 * Math.PI;
          const x1 = centerX + headRadius * Math.cos(angle1);
          const y1 = centerY + headRadius * Math.sin(angle1);
          const x2 = centerX + headRadius * Math.cos(angle2);
          const y2 = centerY + headRadius * Math.sin(angle2);
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          step++;
        } else {
          phase = 1; step = 0;
        }
        break;
      case 1: // 填充头部（粉色），稍停顿后进行
        if(step < headFillDelay) {
          step++;
        } else {
          ctx.save();
          ctx.globalCompositeOperation = 'destination-over'; // 填充在已有线条后面
          ctx.fillStyle = "#FFC0CB";
          ctx.beginPath();
          ctx.arc(centerX, centerY, headRadius, 0, 2 * Math.PI);
          ctx.fill();
          ctx.restore();
          phase = 2; step = 0;
        }
        break;
      case 2: // 绘制左耳轮廓逐渐
        if(step < leftEarEdge1Steps) {
          // 耳朵外侧底部点(base1) -> 耳尖(tip)
          const t1 = step / leftEarEdge1Steps;
          const t2 = (step + 1) / leftEarEdge1Steps;
          const x1 = leftEar.base1.x + (leftEar.tip.x - leftEar.base1.x) * t1;
          const y1 = leftEar.base1.y + (leftEar.tip.y - leftEar.base1.y) * t1;
          const x2 = leftEar.base1.x + (leftEar.tip.x - leftEar.base1.x) * t2;
          const y2 = leftEar.base1.y + (leftEar.tip.y - leftEar.base1.y) * t2;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          step++;
        } else if(step < leftEarEdge1Steps + leftEarEdge2Steps) {
          // 耳尖(tip) -> 耳朵内侧底部点(base2)
          const i = step - leftEarEdge1Steps;
          const t1 = i / leftEarEdge2Steps;
          const t2 = (i + 1) / leftEarEdge2Steps;
          const x1 = leftEar.tip.x + (leftEar.base2.x - leftEar.tip.x) * t1;
          const y1 = leftEar.tip.y + (leftEar.base2.y - leftEar.tip.y) * t1;
          const x2 = leftEar.tip.x + (leftEar.base2.x - leftEar.tip.x) * t2;
          const y2 = leftEar.tip.y + (leftEar.base2.y - leftEar.tip.y) * t2;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          step++;
        } else {
          phase = 3; step = 0;
        }
        break;
      case 3: // 填充左耳
        if(step < earFillDelay) {
          step++;
        } else {
          ctx.fillStyle = "#FFC0CB";
          ctx.beginPath();
          ctx.moveTo(leftEar.base1.x, leftEar.base1.y);
          ctx.lineTo(leftEar.tip.x, leftEar.tip.y);
          ctx.lineTo(leftEar.base2.x, leftEar.base2.y);
          ctx.closePath();
          ctx.fill();
          phase = 4; step = 0;
        }
        break;
      case 4: // 绘制右耳轮廓逐渐
        if(step < rightEarEdge1Steps) {
          const t1 = step / rightEarEdge1Steps;
          const t2 = (step + 1) / rightEarEdge1Steps;
          const x1 = rightEar.base1.x + (rightEar.tip.x - rightEar.base1.x) * t1;
          const y1 = rightEar.base1.y + (rightEar.tip.y - rightEar.base1.y) * t1;
          const x2 = rightEar.base1.x + (rightEar.tip.x - rightEar.base1.x) * t2;
          const y2 = rightEar.base1.y + (rightEar.tip.y - rightEar.base1.y) * t2;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          step++;
        } else if(step < rightEarEdge1Steps + rightEarEdge2Steps) {
          const j = step - rightEarEdge1Steps;
          const t1 = j / rightEarEdge2Steps;
          const t2 = (j + 1) / rightEarEdge2Steps;
          const x1 = rightEar.tip.x + (rightEar.base2.x - rightEar.tip.x) * t1;
          const y1 = rightEar.tip.y + (rightEar.base2.y - rightEar.tip.y) * t1;
          const x2 = rightEar.tip.x + (rightEar.base2.x - rightEar.tip.x) * t2;
          const y2 = rightEar.tip.y + (rightEar.base2.y - rightEar.tip.y) * t2;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          step++;
        } else {
          phase = 5; step = 0;
        }
        break;
      case 5: // 填充右耳
        if(step < earFillDelay) {
          step++;
        } else {
          ctx.fillStyle = "#FFC0CB";
          ctx.beginPath();
          ctx.moveTo(rightEar.base1.x, rightEar.base1.y);
          ctx.lineTo(rightEar.tip.x, rightEar.tip.y);
          ctx.lineTo(rightEar.base2.x, rightEar.base2.y);
          ctx.closePath();
          ctx.fill();
          phase = 6; step = 0;
        }
        break;
      case 6: // 画左眼
        ctx.beginPath();
        ctx.arc(leftEye.x, leftEye.y, eyeRadius, 0, 2*Math.PI);
        ctx.fillStyle = "#000";
        ctx.fill();
        phase = 7; step = 0;
        break;
      case 7: // 画右眼
        ctx.beginPath();
        ctx.arc(rightEye.x, rightEye.y, eyeRadius, 0, 2*Math.PI);
        ctx.fillStyle = "#000";
        ctx.fill();
        phase = 8; step = 0;
        break;
      case 8: // 绘制鼻子轮廓（椭圆）逐渐
        if(step < snoutSteps) {
          const angle1 = (step / snoutSteps) * 2 * Math.PI;
          const angle2 = ((step + 1) / snoutSteps) * 2 * Math.PI;
          const x1 = snoutCenter.x + snoutRadiusX * Math.cos(angle1);
          const y1 = snoutCenter.y + snoutRadiusY * Math.sin(angle1);
          const x2 = snoutCenter.x + snoutRadiusX * Math.cos(angle2);
          const y2 = snoutCenter.y + snoutRadiusY * Math.sin(angle2);
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          step++;
        } else {
          phase = 9; step = 0;
        }
        break;
      case 9: // 填充鼻子并画鼻孔
        if(step < snoutFillDelay) {
          step++;
        } else {
          ctx.save();
          ctx.globalCompositeOperation = 'destination-over'; // 填充在鼻子轮廓线后面
          ctx.fillStyle = "#FF8C94";
          ctx.beginPath();
          ctx.ellipse(snoutCenter.x, snoutCenter.y, snoutRadiusX, snoutRadiusY, 0, 0, 2 * Math.PI);
          ctx.fill();
          ctx.restore();
          // 鼻孔（两个小圆）
          ctx.beginPath();
          ctx.arc(leftNostril.x, leftNostril.y, nostrilRadius, 0, 2*Math.PI);
          ctx.arc(rightNostril.x, rightNostril.y, nostrilRadius, 0, 2*Math.PI);
          ctx.fillStyle = "#000";
          ctx.fill();
          phase = 10; step = 0;
        }
        break;
      case 10: // 画嘴巴
        ctx.beginPath();
        ctx.moveTo(mouthLeft.x, mouthLeft.y);
        ctx.quadraticCurveTo(mouthCtrl.x, mouthCtrl.y, mouthRight.x, mouthRight.y);
        ctx.stroke();
        // 完成，停止动画
        return;
    }
    requestAnimationFrame(animate);
  }
  // 开始动画
  requestAnimationFrame(animate);
</script>
</body>
</html>
